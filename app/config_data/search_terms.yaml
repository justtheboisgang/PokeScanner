# Suchbegriff-Taxonomie (§7).
#
# Echte Formulierungen von Leuten, die NICHT wissen, was sie haben. Der Werthebel
# liegt genau hier. Frei editierbar — kein Code-Deploy nötig, der Loader liest
# diese Datei zur Laufzeit.
#
# `positive`: Suchbegriffe, die einen Kandidaten qualifizieren.
# `negative`: Begriffe, die ein Listing AUSSCHLIESSEN (Sammelalben, Repro, Bulk).
#
# Startliste (~60). Bitte anpassen/erweitern, sobald du siehst, was Flow bringt.
#
# `active`: die kuratierte Teilmenge (~8), die pro Poll tatsächlich bei Apify
# abgefragt wird (§4.4, Kostenkontrolle). Breit gewählt, um über Breite viel
# abzudecken. Nach ~2 Wochen datenbasiert rotieren (Funde je matched_search_term).

