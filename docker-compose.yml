# Docker Compose for a small VPS (§3). Phase 3: Postgres + one-shot migrate +
# FastAPI API + the APScheduler poll worker. The React frontend is built/served
# separately (see README) to keep the VPS image lean.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: poke
      POSTGRES_PASSWORD: poke
      POSTGRES_DB: pokescanner
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poke -d pokescanner"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: apply migrations, then exit. Other services wait for it.
  migrate:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head
    restart: "no"

  api:
    build: .
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: python -m app.scheduler
    restart: unless-stopped

volumes:
  pgdata:
